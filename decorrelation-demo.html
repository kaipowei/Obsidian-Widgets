<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decorrelation 互動圖</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    background: #ffffff; color: #222222;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .panels { display: flex; flex-wrap: wrap; gap: 12px; }
  .panel { flex: 1 1 240px; min-width: 0; }
  .panel h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  canvas { width: 100%; height: auto; display: block; border: 1px solid #d0d0d0; border-radius: 6px; background: #fafafa; }
  .controls { margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { flex: 0 0 150px; font-size: 13px; }
  .row input[type=range] { flex: 1 1 auto; min-width: 0; }
  .row .val { flex: 0 0 44px; text-align: right; font-family: monospace; font-size: 13px; }
  button {
    padding: 6px 14px; font-size: 14px; border: 1px solid #4a6fd0; background: #4a6fd0;
    color: #fff; border-radius: 6px; cursor: pointer; margin-top: 6px;
  }
  button:active { background: #3858b0; }
  .info { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
  .mat { display: inline-block; vertical-align: middle; }
  .mat table { border-left: 2px solid #444; border-right: 2px solid #444; border-radius: 4px; padding: 0 4px; }
  .mat td { padding: 1px 8px; text-align: right; font-family: monospace; }
  .note { margin-top: 10px; font-size: 13px; color: #444; }
  .legend span { display: inline-block; margin-right: 12px; }
</style>
</head>
<body>

<div class="panels">
  <div class="panel">
    <h3>左:X(相關的資料)</h3>
    <canvas id="cL" width="420" height="420"></canvas>
  </div>
  <div class="panel">
    <h3>右:Y = OX(旋轉進度 t = <span id="tTitle">1.00</span>)</h3>
    <canvas id="cR" width="420" height="420"></canvas>
  </div>
</div>

<div class="controls">
  <div class="row"><label for="s1">X1 的 variance</label><input type="range" id="s1" min="0.2" max="10" step="0.1" value="3"><span class="val" id="s1v"></span></div>
  <div class="row"><label for="s2">X2 的 variance</label><input type="range" id="s2" min="0.2" max="10" step="0.1" value="1.5"><span class="val" id="s2v"></span></div>
  <div class="row"><label for="rho">相關係數 rho</label><input type="range" id="rho" min="-0.95" max="0.95" step="0.05" value="0.6"><span class="val" id="rhov"></span></div>
  <div class="row"><label for="t">旋轉進度 t</label><input type="range" id="t" min="0" max="1" step="0.01" value="1"><span class="val" id="tv"></span></div>
  <button id="play">播放轉換 (X 轉成 Y)</button>
</div>

<div class="info">
  <div>左圖 X 的 covariance<br><span class="mat" id="matX"></span></div>
  <div>右圖目前的 covariance<br><span class="mat" id="matY"></span></div>
  <div>Eigenvalues<br><span id="eig" style="font-family:monospace"></span></div>
</div>

<div class="note legend">
  <span>藍點:資料</span>
  <span>實線橢圓:1 個標準差</span>
  <span>虛線橢圓:2 個標準差</span>
  <span style="color:#c0392b">紅箭頭:Σ 的 eigenvector</span>
</div>
<div class="note">
  公式:Σ = O<sup>T</sup> Λ O,Y = OX,cov(Y) = O Σ O<sup>T</sup> = Λ<br>
  O 只做旋轉,所以橢圓的形狀不變。t 從 0 到 1,右圖的 covariance 非對角線會變成 0,橢圓就轉正了。
</div>

<script>
(function () {
  var N = 150, RANGE = 8;

  // 固定隨機點,滑桿動的時候點會平滑移動
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(501);
  var Z = [];
  for (var i = 0; i < N; i++) {
    var u1 = rnd(), u2 = rnd();
    var r = Math.sqrt(-2 * Math.log(u1 + 1e-12));
    Z.push([r * Math.cos(2 * Math.PI * u2), r * Math.sin(2 * Math.PI * u2)]);
  }

  var el = function (id) { return document.getElementById(id); };
  var cL = el("cL"), cR = el("cR");
  var gL = cL.getContext("2d"), gR = cR.getContext("2d");
  var W = cL.width, H = cL.height;

  function f(v) {
    var s = v.toFixed(2);
    if (s === "-0.00") s = "0.00";
    return s;
  }

  var S = {};  // 目前的數值

  function compute() {
    S.s1 = parseFloat(el("s1").value);
    S.s2 = parseFloat(el("s2").value);
    S.rho = parseFloat(el("rho").value);
    S.t = parseFloat(el("t").value);
    S.c = S.rho * Math.sqrt(S.s1 * S.s2);
    // Cholesky: Sigma = L L^T,用來產生有這個 covariance 的點
    S.l11 = Math.sqrt(S.s1);
    S.l21 = S.c / S.l11;
    S.l22 = Math.sqrt(Math.max(S.s2 - S.l21 * S.l21, 0));
    // 2x2 對稱矩陣的 eigen 分解
    S.theta = 0.5 * Math.atan2(2 * S.c, S.s1 - S.s2);
    var mean = (S.s1 + S.s2) / 2;
    var R = Math.sqrt(Math.pow((S.s1 - S.s2) / 2, 2) + S.c * S.c);
    S.lam1 = mean + R;
    S.lam2 = mean - R;
  }

  function toCanvas(x, y) {
    return [W / 2 + x / RANGE * (W / 2), H / 2 - y / RANGE * (H / 2)];
  }

  function drawAxes(g, l1, l2) {
    g.clearRect(0, 0, W, H);
    g.fillStyle = "#fafafa"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#e4e4e4"; g.lineWidth = 1;
    for (var k = -RANGE + 2; k < RANGE; k += 2) {
      var a = toCanvas(k, 0), b = toCanvas(0, k);
      g.beginPath(); g.moveTo(a[0], 0); g.lineTo(a[0], H); g.stroke();
      g.beginPath(); g.moveTo(0, b[1]); g.lineTo(W, b[1]); g.stroke();
    }
    g.strokeStyle = "#888"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
    g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
    g.fillStyle = "#666"; g.font = "13px sans-serif";
    g.fillText(l1, W - 24, H / 2 - 6);
    g.fillText(l2, W / 2 + 6, 16);
  }

  function arrow(g, x0, y0, x1, y1, color) {
    g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    var ang = Math.atan2(y1 - y0, x1 - x0), h = 10;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x1 - h * Math.cos(ang - 0.4), y1 - h * Math.sin(ang - 0.4));
    g.lineTo(x1 - h * Math.cos(ang + 0.4), y1 - h * Math.sin(ang + 0.4));
    g.closePath(); g.fill();
  }

  // alpha 是旋轉角度,0 代表不轉
  function drawScene(g, alpha, labels, showArrows) {
    drawAxes(g, labels[0], labels[1]);
    var ca = Math.cos(alpha), sa = Math.sin(alpha);
    function T(x1, x2) { return [ca * x1 - sa * x2, sa * x1 + ca * x2]; }

    // 橢圓:r = 1 實線,r = 2 虛線
    [1, 2].forEach(function (rad) {
      g.strokeStyle = "#222"; g.lineWidth = 2;
      g.setLineDash(rad === 1 ? [] : [6, 5]);
      g.beginPath();
      for (var k = 0; k <= 120; k++) {
        var p = 2 * Math.PI * k / 120;
        var bx = rad * Math.cos(p), by = rad * Math.sin(p);
        var x1 = S.l11 * bx, x2 = S.l21 * bx + S.l22 * by;
        var q = T(x1, x2), c = toCanvas(q[0], q[1]);
        if (k === 0) g.moveTo(c[0], c[1]); else g.lineTo(c[0], c[1]);
      }
      g.stroke();
    });
    g.setLineDash([]);

    // 資料點
    g.fillStyle = "rgba(74,111,208,0.65)";
    for (var i = 0; i < N; i++) {
      var x1 = S.l11 * Z[i][0], x2 = S.l21 * Z[i][0] + S.l22 * Z[i][1];
      var q = T(x1, x2), c = toCanvas(q[0], q[1]);
      g.beginPath(); g.arc(c[0], c[1], 3, 0, 2 * Math.PI); g.fill();
    }

    if (showArrows) {
      var o = toCanvas(0, 0);
      var a1 = Math.sqrt(S.lam1), a2 = Math.sqrt(S.lam2);
      var e1 = toCanvas(a1 * Math.cos(S.theta), a1 * Math.sin(S.theta));
      var e2 = toCanvas(-a2 * Math.sin(S.theta), a2 * Math.cos(S.theta));
      arrow(g, o[0], o[1], e1[0], e1[1], "#c0392b");
      arrow(g, o[0], o[1], e2[0], e2[1], "#c0392b");
    }
  }

  function matHTML(a, b, c, d) {
    return "<table><tr><td>" + f(a) + "</td><td>" + f(b) + "</td></tr><tr><td>" + f(c) + "</td><td>" + f(d) + "</td></tr></table>";
  }

  function render() {
    compute();
    el("s1v").textContent = S.s1.toFixed(1);
    el("s2v").textContent = S.s2.toFixed(1);
    el("rhov").textContent = S.rho.toFixed(2);
    el("tv").textContent = S.t.toFixed(2);
    el("tTitle").textContent = S.t.toFixed(2);

    drawScene(gL, 0, ["x1", "x2"], true);
    var alpha = -S.t * S.theta;
    drawScene(gR, alpha, ["y1", "y2"], false);

    // 右圖目前的 covariance = R Sigma R^T
    var ca = Math.cos(alpha), sa = Math.sin(alpha);
    var m11 = ca * S.s1 - sa * S.c, m12 = ca * S.c - sa * S.s2;
    var m21 = sa * S.s1 + ca * S.c, m22 = sa * S.c + ca * S.s2;
    var c11 = m11 * ca - m12 * sa, c12 = m11 * sa + m12 * ca;
    var c21 = m21 * ca - m22 * sa, c22 = m21 * sa + m22 * ca;

    el("matX").innerHTML = matHTML(S.s1, S.c, S.c, S.s2);
    el("matY").innerHTML = matHTML(c11, c12, c21, c22);
    el("eig").innerHTML = "λ1 = " + f(S.lam1) + "<br>λ2 = " + f(S.lam2);
  }

  ["s1", "s2", "rho", "t"].forEach(function (id) {
    el(id).addEventListener("input", render);
  });

  var raf = null;
  el("play").addEventListener("click", function () {
    if (raf) cancelAnimationFrame(raf);
    var start = null, dur = 1800;
    el("t").value = 0; render();
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      el("t").value = p; render();
      if (p < 1) raf = requestAnimationFrame(step); else raf = null;
    }
    raf = requestAnimationFrame(step);
  });

  render();
})();
</script>
</body>
</html>
